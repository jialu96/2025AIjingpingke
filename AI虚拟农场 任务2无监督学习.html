<!DOCTYPE html>
<html>
<head>
    <title>AI虚拟农场 - 机器学习的核心学习范式</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1400px; margin: 0 auto; padding: 6px; }
        .task-card { 
            border: 2px solid #42a5f5; 
            border-radius: 6px; 
            padding: 6px; 
            background-color: #f8f9fa;
            min-height: 20px;
        }
        .task-title { color: #1976d2; border-bottom: 1px dashed #42a5f5; padding-bottom: 5px; margin-bottom: 5px; }
        .image-gallery { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            margin: 15px 0; 
            max-height: 220px; 
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 5px;
            background-color: #fff;
        }
        .soil-img { 
            width: 100px; 
            height: 100px; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: transform 0.2s;
            border: 2px solid #ddd;
        }
        .soil-img:hover { 
            transform: scale(1.05); 
            border-color: #42a5f5;
        }
        .control-panel { margin: 25px 0; }
        .btn { 
            background-color: #42a5f5; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-right: 15px;
            font-size: 16px;
        }
        .btn:hover { background-color: #1976d2; }
        .feedback { 
            margin-top: 10px; 
            padding: 12px; 
            border-radius: 5px; 
            background-color: #e3f2fd; 
            min-height: 20px;
            font-size: 15px;
            line-height: 1.5;
        }
        .classify-tip { 
            margin: 10px 0; 
            font-size: 14px; 
            color: #555;
        }
        .result-section { margin-top: 30px; }
        .cluster-result {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .cluster-group {
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #42a5f5;
            background-color: rgba(66, 165, 245, 0.1);
        }
    </style>
</head>
<body>
    <h1>🌱 AI虚拟农场 - 机器学习的核心学习范式</h1>

    <div class="task-card">
        <h2 class="task-title">任务2：稻麦品种分类</h2>

        <div>
            <h4>第一步：收集稻麦图片</h4>
            <div class="classify-tip">🔍 在稻麦图片库（1-10号照片）中，没有品种名称，没有标注。</div>
            <div class="image-gallery" id="soilGallery">
                <!-- 初始化1-10号无标签稻麦照片 -->
            </div>
            <div class="feedback" id="unsupervisedFeedback">
            请先观察图片库中稻麦的差异，尝试自主分类，在学习任务单上记录你的分类：组1：___号稻麦（分类依据：____）；组2：___号稻麦（分类依据：____）；组3：___号稻麦（分类依据：____）。
             </div>
        </div>

      <div>
            <h4>第二步：训练模型，发现特征</h4>
            <div class="control-panel">
                <button class="btn" onclick="trainUnsupervised()">训练</button>
            </div>
            <div class="cluster-result" id="clusterResult">
                <!-- 聚类结果将动态生成 -->
            </div>
       </div>

        <div class="result-section">
            <h4>第三步：测试验证模型，稻麦品种分类</h4>
            <div class="control-panel">
                <button class="btn" onclick="showUserClassify()">测试</button>
            </div>
            <div class="image-gallery" id="testGallery">
                <!-- 测试用作物照片（可自行替换为其他照片） -->
                <img src="211.png" class="soil-img" title="测试作物1">
            </div>
            <div class="feedback" id="unsupervisedFeedback2">
                <!-- 测试结果将动态生成 -->
            </div>
        </div>

        
    </div>

    <script>
        // 初始化1-10号无标签农作物图片库
        const soilGallery = document.getElementById('soilGallery');
        for (let i = 201; i <= 210; i++) {
            const img = document.createElement('img');
            img.className = 'soil-img';
            img.src = `${i}.png`; // 引用1-10号图片（需与HTML同目录）
            img.title = `${i-200}号稻麦`;
            img.dataset.id = i;
            soilGallery.appendChild(img);
        }

        // 存储用户分类结果
        let userClusters = {};

        //无监督学习：测试
        function showUserClassify() {
            const feedback = document.getElementById('unsupervisedFeedback2');
            feedback.textContent = 
                '📊 测试结果：这张图片，籽粒颜色呈金黄色，穗状花序呈圆锥形，属于组1。' ;
        }

        // 无监督学习：AI聚类
       //组1：水稻  组2：小麦  组3：大麦
        function trainUnsupervised() {
            // 模拟AI聚类逻辑（按图片特征相似度分组，此处简化为3类）
            const clusters = {
                '组1（籽粒颜色呈金黄色，穗状花序呈圆锥形）': [201, 203, 205, 208],
                '组2（籽粒颜色呈白色，穗状花序呈椭圆形）': [202, 207, 210],
                '组3（籽粒颜色呈棕色，穗状花序呈长条形）': [204, 206, 209]
            };

            // 生成聚类结果展示
            const clusterResult = document.getElementById('clusterResult');
            clusterResult.innerHTML = '';
            for (const [group, ids] of Object.entries(clusters)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'cluster-group';
                groupDiv.innerHTML = `<strong>${group}</strong><br>`;
                ids.forEach(id => {
                    const img = document.createElement('img');
                    img.src = `${id}.png`;
                    img.width = 60;
                    img.height = 60;
                    img.style.borderRadius = '4px';
                    groupDiv.appendChild(img);
                });
                clusterResult.appendChild(groupDiv);
            }

        }
    </script>
</body>
</html>
